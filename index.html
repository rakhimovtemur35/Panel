<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduVerse Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#06051a;--v:#7b61ff;--c:#1de9ff;--p:#ff4fd8;--y:#ffcf3f;--ok:#4dffa6;--t:#f2f1ff;--m:#9b99c9;--g:rgba(255,255,255,.06);--b:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 40% at 20% 20%,#7b61ff55,transparent),radial-gradient(35% 35% at 80% 30%,#ff4fd844,transparent),radial-gradient(40% 40% at 50% 90%,#1de9ff33,transparent);animation:au 18s ease-in-out infinite alternate}
@keyframes au{to{transform:translate(4%,3%) rotate(8deg) scale(1.1)}}
#bg{position:fixed;inset:0;z-index:0}#app{position:relative;z-index:1}
h1,h2,h3,.big,.logo{font-family:Unbounded,Manrope,sans-serif}
.glass{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px}
button{font:inherit;cursor:pointer;border:0;color:var(--t)}
.btn{padding:12px 20px;border-radius:14px;font-weight:800;background:linear-gradient(135deg,var(--v),var(--p));box-shadow:0 8px 30px -8px var(--v);transition:.18s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.gh{background:var(--g);border:1px solid var(--b);box-shadow:none}.btn.rd{background:#ff3b5c;box-shadow:none}
input,select{font:inherit;color:var(--t);background:rgba(255,255,255,.07);border:1px solid var(--b);border-radius:12px;padding:12px 14px;width:100%;outline:0}
input:focus{border-color:var(--c);box-shadow:0 0 0 3px #1de9ff33}select option{background:#14122e}:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.land{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:6vw}
.land h1{font-size:clamp(46px,8vw,112px);line-height:.95;font-weight:800;background:linear-gradient(120deg,#fff,var(--c) 40%,var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.land p{color:var(--m);margin-top:18px;max-width:460px;line-height:1.6}
.box{padding:30px;display:grid;gap:12px}.err{color:#ff6b86;font-size:14px;min-height:18px}.lnk{color:var(--c);font-size:14px}
.avs{display:flex;gap:6px;flex-wrap:wrap}.av{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--g);border:1px solid var(--b)}.av.on{border-color:var(--c);box-shadow:0 0 18px #1de9ff66;transform:scale(1.1)}
.shell{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px;min-height:100vh}
.side{padding:20px;display:flex;flex-direction:column;gap:8px;position:sticky;top:20px;height:calc(100vh - 40px)}
.logo{font-weight:800;font-size:20px;background:linear-gradient(120deg,var(--c),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.pf{display:grid;gap:4px;padding:14px;border-radius:16px;background:var(--g);border:1px solid var(--b);margin:8px 0}.pf .ava{font-size:38px}.pf small{color:var(--m)}
.nav{text-align:left;padding:11px 14px;border-radius:12px;background:0;color:var(--m);font-weight:700;width:100%}.nav:hover{background:var(--g);color:var(--t)}.nav.on{background:linear-gradient(135deg,#7b61ff66,#ff4fd833);color:#fff}
nav{display:grid;gap:4px;margin-bottom:auto}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--v),var(--p));transition:width .25s}
#mn{display:grid;gap:18px;align-content:start;min-width:0}#mn>h2{font-size:26px}
.card{padding:22px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1;min-width:130px}
.onl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pl{padding:6px 12px;border-radius:99px;background:var(--g);border:1px solid var(--b);font-size:14px;opacity:.55}.pl.on{opacity:1;border-color:var(--ok)}.pl b{color:var(--y)}
.hero2{text-align:center;padding:34px}.hero2 h2{margin-bottom:10px}.hero2 p{color:var(--m);max-width:520px;margin:0 auto 14px}
.tm{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}
.qq{font-size:24px;margin:20px 0;text-align:center}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{padding:22px;border-radius:16px;font-weight:800;font-size:18px;text-align:left;transition:.15s}.o0{background:#e21b3c}.o1{background:#1368ce}.o2{background:#d89e00}.o3{background:#26890c}
.opt.dim{opacity:.22}.opt.rt{outline:4px solid #fff;transform:scale(1.03)}.opt.sel{outline:3px dashed #fff}.opt:disabled{cursor:default}
.gain{text-align:center;margin-top:14px;font-weight:800;color:var(--y)}
.words{font-size:21px;line-height:1.7;padding:18px;background:#0005;border-radius:14px;margin:12px 0;color:var(--m)}.words .ok{color:var(--ok)}.words .bad{background:#ff3b5c66;color:#fff;border-radius:4px}
.pb{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-top:8px;font-size:14px}
.lr{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--b)}
.tb2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}.tmr b{font-family:Unbounded;font-size:34px}
.tapb{width:100%;padding:44px 10px;font-size:26px;font-weight:800;border-radius:24px;margin-top:10px;transition:transform .05s;touch-action:manipulation;user-select:none}.tapb:active{transform:scale(.96)}.tapb small{display:block;font-size:13px;font-weight:600;opacity:.8}.tapb.r{background:#e21b3c}.tapb.b{background:#1368ce}.tapb.n{background:var(--v)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.gc{cursor:pointer;transition:transform .15s;transform-style:preserve-3d}.gc:hover{border-color:var(--c)}.gc .ic{font-size:50px;display:block;transform:translateZ(40px)}.gc h3{margin:10px 0 6px;font-size:16px}.gc p{color:var(--m);font-size:14px;line-height:1.5}
.pod{display:flex;gap:14px;align-items:flex-end;justify-content:center;perspective:900px;margin:10px 0}.pod div{width:140px;text-align:center;padding:14px 8px;border-radius:18px 18px 0 0;border:1px solid var(--b);transform:rotateX(8deg)}.pod .p0{height:200px;background:linear-gradient(#ffcf3f55,#ffcf3f11)}.pod .p1{height:160px;background:linear-gradient(#cfd8ff44,#cfd8ff0d)}.pod .p2{height:130px;background:linear-gradient(#ff9a5a44,#ff9a5a0d)}.pod .ava{font-size:34px}.pod b{display:block}
table{width:100%;border-collapse:collapse}td,th{padding:11px 8px;text-align:left;border-bottom:1px solid var(--b)}th{color:var(--m);font-size:13px}
.chat{display:grid;gap:12px}#cl{height:56vh;overflow:auto;display:grid;gap:8px;align-content:start}.msg{padding:10px 14px;border-radius:14px;background:var(--g);max-width:80%}.msg.st{background:#7b61ff44;border:1px solid var(--v)}.msg small{color:var(--m);display:block}
#game{position:fixed;inset:0;z-index:50;background:#05040fcc;backdrop-filter:blur(8px);display:none;place-items:center;padding:16px}#game.on{display:grid}
.gb{width:min(760px,100%);max-height:94vh;overflow:auto;padding:28px;text-align:center;position:relative}.x{position:absolute;top:12px;right:12px}.big{font-size:48px;color:var(--c);margin:12px 0}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:16px auto;perspective:900px}.mc{aspect-ratio:1;position:relative;transform-style:preserve-3d;transition:transform .45s;background:0;border-radius:14px}.mc.f{transform:rotateY(180deg)}.mc span{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;font-size:34px}.fa{background:linear-gradient(135deg,var(--v),var(--p))}.fb{background:#1a1740;border:1px solid var(--c);transform:rotateY(180deg)}
.rxb{width:100%;padding:70px 10px;border-radius:20px;font-size:26px;font-weight:800;background:#e21b3c;margin-top:16px}.rxb.go{background:#26890c}
.arena{position:relative;height:340px;background:#0005;border-radius:16px;overflow:hidden;margin-top:10px}.tg{position:absolute;width:54px;height:54px;border-radius:50%;background:radial-gradient(#fff 12%,var(--p) 14% 40%,#fff 42% 55%,var(--p) 57%);border:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;padding:13px 20px;border-radius:14px;background:#14122e;border:1px solid var(--c);max-width:90vw;word-break:break-all}

.btn{box-shadow:0 5px 0 #4328b5,0 16px 30px -10px var(--v)}.btn:active{transform:translateY(4px)!important;box-shadow:0 1px 0 #4328b5}.btn.gh{box-shadow:0 4px 0 #0008}.btn.rd{box-shadow:0 5px 0 #a3142f}
.card,.pf{position:relative}.card:before,.pf:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),#ffffff22,transparent 60%);opacity:0;transition:opacity .2s;pointer-events:none}.card:hover:before,.pf:hover:before{opacity:1}
.card,.pf,.gc,.opt,.tapb{transition:transform .12s ease-out,border-color .2s}
.glass{box-shadow:0 30px 60px -30px #000c,inset 0 1px 0 #ffffff22}
@keyframes sw{from{opacity:0;transform:perspective(900px) rotateX(-14deg) translateY(26px) scale(.96)}}.sw>*{animation:sw .55s cubic-bezier(.2,.8,.2,1) both}.sw>*:nth-child(2){animation-delay:.07s}.sw>*:nth-child(3){animation-delay:.14s}.sw>*:nth-child(4){animation-delay:.21s}
.fl{position:fixed;bottom:-50px;font-size:36px;z-index:60;pointer-events:none;animation:fu 3.4s ease-out forwards;text-shadow:0 10px 20px #0008}@keyframes fu{to{transform:translateY(-88vh) rotateY(720deg) scale(1.5);opacity:0}}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:320px;margin:16px auto}.sp{aspect-ratio:1;border-radius:22px;opacity:.55;box-shadow:0 8px 0 #0007;transition:.12s}.sp.lit{opacity:1;transform:translateY(5px) scale(1.04);box-shadow:0 0 40px #fff8}
#bq{min-height:64px;margin:6px 0 12px}.stro{font-size:64px}
@media(max-width:860px){.land{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:static;height:auto}nav{grid-template-columns:repeat(3,1fr)}.opts{grid-template-columns:1fr}.pod div{width:96px}.pb{grid-template-columns:100px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><canvas id="bg"></canvas><div id="app"></div><div id="game"></div>
<script>
const $=s=>document.querySelector(s),R=a=>a[Math.random()*a.length|0],E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const AV=['🦊','🐼','🦁','🐯','🐸','🦄','🐙','🚀','🐲','🦉'],TT=['Yangi','Izlanuvchi','Jangchi','Usta','Ustoz','Afsona'],lv=p=>Math.min(5,p/200|0);
const B=(location.protocol==='file:'||location.port==='5500')?'http://'+(location.hostname||'localhost')+':3000':'';
let lastRx=null,T=localStorage.getItem('ev2'),S=null,me=null,off=0,pg='arena',es,mine={},tapN=0,av=R(AV),rxT;
const api=(a,o={})=>T&&fetch(B+'/api/act?t='+T,{method:'POST',body:JSON.stringify({a,...o})}).catch(()=>{});
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2600)};
/* ---- kirish ---- */
function land(){if(es)es.close();$('#app').innerHTML=`<div class=land><div><h1>Edu<br>Verse</h1><p>Jonli sinf arenasi: do'stlaringiz bilan birga viktorina, yozish poygasi va jamoa jangi. Ismingizni o'zingiz tanlaysiz.</p></div>
<div class="glass box" id=lb><h2>O'yinga qo'shil</h2><div class=avs>${AV.map(a=>`<button class="av ${a===av?'on':''}" onclick="av=this.textContent;document.querySelectorAll('.av').forEach(b=>b.classList.toggle('on',b===this))">${a}</button>`).join('')}</div>
<input id=jn placeholder="Ismingiz (xohlagan ism)" maxlength=16><input id=jp onkeydown="if(event.key=='Enter')this.parentNode.querySelector('.btn').click()" placeholder="Kirish paroli" value="${E(new URLSearchParams(location.search).get('pw')||'')}"><div class=err id=er></div><button class=btn onclick="auth('/api/join',{n:$('#jn').value,pw:$('#jp').value,a:av})">Qo'shilish</button><a href=# class=lnk onclick="tl();return false">Men o'qituvchi yoki boshqaruvchiman</a></div></div>`}
function tl(){$('#lb').innerHTML=`<h2>Xodimlar kirishi</h2><input id=lu placeholder="Login"><input id=lw type=password onkeydown="if(event.key=='Enter')this.parentNode.querySelector('.btn').click()" placeholder="Parol"><div class=err id=er></div><button class=btn onclick="auth('/api/login',{u:$('#lu').value.trim().toLowerCase(),p:$('#lw').value})">Kirish</button><a href=# class=lnk onclick="land();return false">← O'quvchi sifatida</a>`}
async function auth(u,b){const e=$('#er');e.textContent=''; try{const r=await fetch(B+u,{method:'POST',body:JSON.stringify(b)}),j=await r.json();if(!r.ok)return e.textContent=j.e||'Xatolik';T=j.t;localStorage.setItem('ev2',T);boot()}catch(x){e.textContent="Serverga ulanib bo'lmadi. Terminalda `node server.js` ishga tushiring (papka ichida), keyin http://localhost:3000 ni oching."}}
const out=()=>{localStorage.removeItem('ev2');T=null;S=null;land()};
function boot(){$('#app').innerHTML=`<div class=shell><aside class="glass side"><div class=logo>EduVerse</div><div id=pf></div><nav id=nv></nav><button class="btn sm gh" onclick=inv()>🔗 Do'st taklif qilish</button><button class="btn sm gh" onclick=out()>Chiqish</button></aside><main id=mn></main></div>`;conn();go('arena')}
function conn(){es=new EventSource(B+'/api/events?t='+T);es.onmessage=e=>{S=JSON.parse(e.data);off=S.now-Date.now();me=S.me;upd()};es.onerror=()=>{if(es.readyState===2)out()}}
const inv=()=>{const u=(B||location.origin)+'/?pw='+encodeURIComponent(S.join);navigator.clipboard&&navigator.clipboard.writeText(u);toast('Havola nusxalandi: '+u)};
/* ---- sahifalar ---- */
const st=()=>me.role!=='student',lb=()=>`<div class=row><button class=btn onclick="api('live',{g:'quiz'})">🧠 Quiz Battle</button><button class=btn onclick="api('live',{g:'type'})">⌨️ Yozish poygasi</button><button class=btn onclick="api('live',{g:'tap'})">⚡ Jamoa janggi</button><button class=btn onclick="api('live',{g:'math'})">🧮 Hisob duel</button><button class=btn onclick="api('live',{g:'word'})">🔤 So'z duel</button><button class="btn rd" onclick="api('stop')">To'xtatish</button></div>`;
const SOLO=[['🃏','Memory 3D',"Juft kartalarni toping",'gmem'],['⚡','Reaksiya',"5 raund, millisekund hisobida",'grx'],['🧮','Math Sprint',"30 soniyada ko'proq hisoblang",'gmath'],['🎯','Aim Trainer',"20 soniya nishonlarni uring",'gaim'],['🎵','Simon',"Rang ketma-ketligini eslab qoling",'gsimon'],['🔤',"So'zni top","Aralashgan harflardan so'z tuzing",'gscr'],['🌈','Rang sinovi',"So'z rangini bosing, matnni emas",'gstroop'],['🐍','Snake',"Olmalarni yig', devorga urilmang",'gsnake']];
const BD=[[100,'🔥'],[300,'⚡'],[600,'💎'],[1000,'👑']];
function go(p){pg=p;live.sig=null;$('#mn').innerHTML={
 arena:`<div class="glass card"><h3>Onlayn: <span id=oc></span></h3><div class=onl id=on></div></div><div class=onl>${['🔥','👏','😂','😮','❤️','🎉'].map(e=>`<button class="btn sm gh" onclick="api('react',{e:'${e}'})">${e}</button>`).join('')}</div><div id=live></div>`,
 games:`<h2>Yakka o'yinlar</h2><p style=color:var(--m)>Natijangiz umumiy reytingga qo'shiladi.</p><div class=grid>${SOLO.map(g=>`<div class="glass card gc" onclick="${g[3]}()"><span class=ic>${g[0]}</span><h3>${g[1]}</h3><p>${g[2]}</p></div>`).join('')}</div>`,
 rank:`<h2>Reyting</h2><div id=rk></div>`,
 chat:`<h2>Chat</h2><div class="glass card chat"><div id=cl></div><div class=row><input id=cm placeholder="Xabar yozing..." maxlength=200 onkeydown="if(event.key=='Enter')sendc()"><button class=btn onclick=sendc()>Yuborish</button></div></div>`,
 get ctl(){return `<h2>Boshqaruv</h2><div class="glass card"><h3>Jonli o'yin</h3>${lb()}<p style=margin-top:12px;color:var(--m)>Joriy kirish paroli: <b id=jc style=color:var(--y)></b></p></div>${me.role==='admin'?`<div class="glass card"><h3>Xavfsizlik</h3><div class=row><input id=jw placeholder="Yangi kirish paroli"><button class=btn onclick="api('join',{p:$('#jw').value});toast('Saqlandi')">Kirish parolini almashtirish</button></div><div class=row><select id=tu><option>dilnoza<option>jasur</select><input id=tpw placeholder="O'qituvchi yangi paroli"><button class=btn onclick="api('pw',{u:$('#tu').value,p:$('#tpw').value});toast('Saqlandi')">Saqlash</button></div><div class=row><button class="btn rd" onclick="confirm('Barcha ballar nolga tushadi. Davom etasizmi?')&&api('reset')">Ballarni nolga tushirish</button></div></div>`:''}<div class="glass card"><h3>Ishtirokchilar</h3><div id=ctp></div></div>`}}[p];
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.p===p));const m=$('#mn');m.classList.remove('sw');void m.offsetWidth;m.classList.add('sw');kick();S&&upd()}
const sendc=()=>{const i=$('#cm');api('chat',{m:i.value});i.value=''};
const sorted=()=>[...S.P].sort((a,b)=>b.s-a.s),topL=n=>sorted().slice(0,n).map((x,i)=>`<div class=lr><span>${i+1}. ${x.a} ${E(x.n)}</span><b>${x.s}</b></div>`).join('');
function upd(){const s=st(),p=S.P.find(x=>x.id===me.id);if(!s&&!p)return out();
 if(S.rx){if(lastRx===null)lastRx=Math.max(0,...S.rx.map(r=>r.i));S.rx.forEach(r=>{if(r.i>lastRx){lastRx=r.i;floatE(r.e)}})}
 if(!$('#nv').innerHTML)$('#nv').innerHTML=[['arena','🏟 Arena'],['games',"🎮 O'yinlar"],['rank','🏆 Reyting'],['chat','💬 Chat'],...(s?[['ctl','🛡 Boshqaruv']]:[])].map(x=>`<button class="nav ${pg===x[0]?'on':''}" data-p=${x[0]} onclick="go('${x[0]}')">${x[1]}</button>`).join('');
 $('#pf').innerHTML=s?`<div class=pf><span class=ava>🎓</span><b>${E(me.n)}</b><small>${me.role==='admin'?'Boshqaruvchi':"O'qituvchi"}</small></div>`:`<div class=pf><span class=ava>${p.a}</span><b>${E(p.n)}</b><small>${TT[lv(p.s)]} · Lv ${lv(p.s)+1} · ${p.s} ball</small><small>${BD.filter(b=>p.s>=b[0]).map(b=>b[1]).join(' ')||'🌱 Yangi'}</small><div class=bar><i style="width:${p.s%200/2}%"></i></div></div>`;
 const on=$('#on');if(on){$('#oc').textContent=S.on.length;on.innerHTML=[...S.P].sort((a,b)=>S.on.includes(b.id)-S.on.includes(a.id)).map(x=>`<span class="pl ${S.on.includes(x.id)?'on':''}">${x.a} ${E(x.n)} <b>${x.s}</b></span>`).join('')||'<span style=color:var(--m)>Hali hech kim yo\'q. Do\'stlaringizni taklif qiling!</span>'}
 if($('#live'))live();
 const rk=$('#rk');if(rk){const A=sorted(),N={mem:'Memory',rx:'Reaksiya',math:'Math',aim:'Aim',simon:'Simon',scr:"So'z",stroop:'Rang',snake:'Snake'};rk.innerHTML=`<div class=pod>${[1,0,2].map(i=>A[i]?`<div class=p${i}><div class=ava>${A[i].a}</div><b>${E(A[i].n)}</b>${A[i].s}</div>`:'').join('')}</div><div class="glass card"><table>${A.map((x,i)=>`<tr><td>${i+1}</td><td>${x.a} ${E(x.n)}</td><td>${TT[lv(x.s)]}</td><td style=width:30%><div class=bar><i style="width:${x.s%200/2}%"></i></div></td><td><b>${x.s}</b></td></tr>`).join('')}</table></div><div class=grid style=margin-top:16px>${Object.entries(S.hs).map(([g,h])=>`<div class="glass card"><h3>${N[g]||g} rekordlari</h3>${h.map(x=>`<div class=lr><span>${E(x.n)}</span><b>${x.s}</b></div>`).join('')}</div>`).join('')}</div>`}
